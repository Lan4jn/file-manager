server:
  port: 9080

spring:
  application:
    name: file-manager
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # SQLite数据库配置
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:file-manager.db
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: Poss@1234
  default-bucket: file-manager
  public-url: http://localhost:9000

# JWT配置
jwt:
  secret: file-manager-jwt-secret-key-2024
  expiration: 86400000

# 文件配置
file:
  preview-max-size: 10485760
  allowed-extensions:
    - jpg
    - jpeg
    - png
    - gif
    - bmp
    - webp
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - txt
    - mp3
    - mp4
    - avi
    - zip
    - rar
    - jar

# 分享链接配置
share:
  default-expiration: 24

logging:
  level:
    com.poss.file: debug
