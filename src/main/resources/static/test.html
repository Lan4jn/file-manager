<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <link rel="stylesheet" href="/css/element-plus.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app">
        <h1>Testing Vue and Element Plus</h1>
        <el-button @click="test">Click Me</el-button>
    </div>

    <script src="/js/vue.global.js"></script>
    <script src="/js/element-plus.full.js"></script>
    <script src="/js/element-icons.js"></script>
    <script>
        console.log('Vue:', typeof Vue);
        console.log('ElementPlus:', typeof ElementPlus);
        console.log('ElementPlusIconsVue:', typeof ElementPlusIconsVue);

        const { createApp, ref } = Vue;
        const app = createApp({
            setup() {
                const test = () => {
                    ElementPlus.ElMessage.success('Hello!');
                };
                return { test };
            }
        });
        app.use(ElementPlus);
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.mount('#app');
    </script>
</body>
</html>
