    <style>
        :root {
            --bg-1: #f3eadc;
            --bg-2: #efe6da;
            --panel: rgba(255, 252, 246, 0.9);
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #9a3412;
            --accent-soft: #f6d7bf;
            --border: #e7d3bc;
            --danger: #b91c1c;
            --shadow: rgba(120, 53, 15, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(154, 52, 18, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(249, 115, 22, 0.12), transparent 24%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            padding: 28px;
        }

        .shell {
            max-width: 980px;
            margin: 0 auto;
        }

        .hero {
            background: linear-gradient(135deg, rgba(255, 249, 240, 0.94), rgba(255, 252, 246, 0.78));
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 30px 80px var(--shadow);
            backdrop-filter: blur(12px);
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .hero-head {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.15;
        }

        .meta,
        .hint,
        .error {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.7;
        }

        .meta {
            color: var(--muted);
        }

        .hint {
            color: var(--accent);
        }

        .error {
            color: var(--danger);
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 13px;
        }

        .verify {
            margin-top: 22px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input {
            min-width: 220px;
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.92);
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 12px 18px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .hidden {
            display: none !important;
        }

        .panel {
            margin-top: 20px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.72);
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid rgba(231, 211, 188, 0.8);
            background: rgba(255, 247, 238, 0.9);
            flex-wrap: wrap;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
        }

        .crumb {
            color: var(--muted);
            font-size: 13px;
        }

        .list {
            padding: 8px 0;
        }

        .item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 16px;
            align-items: center;
            padding: 14px 22px;
            border-top: 1px solid rgba(231, 211, 188, 0.55);
        }

        .item:first-child {
            border-top: 0;
        }

        .item-main {
            min-width: 0;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-sub {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .item-kind {
            font-size: 13px;
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 999px;
            padding: 8px 12px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .task-action-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
        }

        .task-action-btn--danger {
            color: var(--danger);
            border-color: rgba(185, 28, 28, 0.24);
        }

        .empty {
            padding: 40px 22px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 720px) {
            body {
                padding: 16px;
            }

            .hero {
                padding: 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 28px;
            }

            .item {
                grid-template-columns: 1fr;
            }

            .item-actions {
                justify-content: flex-start;
            }
        }
    </style>

<main class="shell" id="share-main">
    <div class="hero" data-enter>
        <header class="share-brand"><span class="title-3">文件管理器</span><a href="./">返回工作台</a></header>
        <div class="hero-head">
            <div>
                <h1 id="title" data-enter-whole>正在加载分享内容</h1>
                <div class="meta" id="meta"></div>
                <div class="hint" id="hint"></div>
                <div class="error" id="error" role="alert" aria-live="polite"></div>
            </div>
            <div class="stats">
                <div class="badge" id="typeBadge">分享</div>
                <div class="badge" id="countBadge">等待验证</div>
            </div>
        </div>

        <section id="verifyBlock" class="verify hidden" aria-labelledby="verifyHeading">
            <h2 id="verifyHeading">验证提取码</h2>

            <input id="password" aria-label="提取码" autocomplete="off" type="text" placeholder="请输入提取码">
            <button id="verifyBtn">验证并进入</button>
        </section>

        <div id="singleActions" class="verify hidden">
            <button id="downloadBtn">下载文件</button>
            <button id="refreshBtn" class="secondary">重新验证</button>
        </div>

        <div id="browserPanel" class="panel hidden">
            <div class="panel-head">
                <div>
                    <div class="panel-title">共享文件</div>
                    <div class="crumb" id="crumb">根目录</div>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button id="downloadAllBtn">全部下载</button>
                    <button id="backBtn" class="secondary hidden">返回上级</button>
                </div>
            </div>
            <div class="list" id="itemList"></div>
            <div class="empty hidden" id="emptyState">当前目录没有内容</div>
        </div>

        <div id="shareDownloadCenter" class="panel hidden share-download-task-center">
            <div class="panel-head">
                <div>
                    <div class="panel-title">下载任务</div>
                    <div class="crumb" id="shareDownloadSummary">暂无下载任务</div>
                </div>
                <button id="shareDownloadMinimizeBtn" class="secondary">最小化</button>
            </div>
            <div class="list" id="shareDownloadTaskList"></div>
        </div>
    </div>
</main>

<button id="shareDownloadToggle" class="secondary hidden share-download-toggle" type="button">下载任务</button>

<script src="./js/axios.min.js"></script>
<script src="./js/context-path-helpers.js"></script>
<script src="./js/download-manager.js"></script>
<script src="./js/transfer-ui-helpers.js"></script>
<script>
    (function () {
        var contextPathHelpers = window.ContextPathHelpers || {};
        var contextPath = (window.__APP_CONTEXT_PATH__
            || contextPathHelpers.inferContextPath(window.location.pathname, ['/share.html']));
        window.__APP_CONTEXT_PATH__ = contextPath;
        var joinContextPath = contextPathHelpers.joinContextPath || function (_, path) { return path; };
        var apiPath = function (path) { return joinContextPath(contextPath, path); };
        var params = new URLSearchParams(window.location.search);
        var shareCode = params.get('shareCode') || params.get('code');
        var password = params.get('password') || '';
        var shareInfo = null;
        var shareDisplayPath = '';
        var currentPath = '';
        var historyStack = [];
        var downloadThresholdMB = 100;
        var downloadHelpers = window.FileManagerDownloads || {};

        var titleEl = document.getElementById('title');
        var metaEl = document.getElementById('meta');
        var hintEl = document.getElementById('hint');
        var errorEl = document.getElementById('error');
        var typeBadge = document.getElementById('typeBadge');
        var countBadge = document.getElementById('countBadge');
        var verifyBlock = document.getElementById('verifyBlock');
        var passwordInput = document.getElementById('password');
        var verifyBtn = document.getElementById('verifyBtn');
        var singleActions = document.getElementById('singleActions');
        var downloadBtn = document.getElementById('downloadBtn');
        var refreshBtn = document.getElementById('refreshBtn');
        var browserPanel = document.getElementById('browserPanel');
        var crumbEl = document.getElementById('crumb');
        var itemListEl = document.getElementById('itemList');
        var emptyStateEl = document.getElementById('emptyState');
        var downloadAllBtn = document.getElementById('downloadAllBtn');
        var backBtn = document.getElementById('backBtn');
        var shareDownloadCenter = document.getElementById('shareDownloadCenter');
        var shareDownloadTaskList = document.getElementById('shareDownloadTaskList');
        var shareDownloadSummary = document.getElementById('shareDownloadSummary');
        var shareDownloadToggle = document.getElementById('shareDownloadToggle');
        var shareDownloadMinimizeBtn = document.getElementById('shareDownloadMinimizeBtn');
        var downloadTasks = [];
        var downloadCenterMinimized = false;

        if (!shareCode) {
            renderError('分享码缺失');
            return;
        }

        passwordInput.value = password;
        bindEvents();
        loadAccessInfo();

        function bindEvents() {
            verifyBtn.addEventListener('click', verifyShare);
            refreshBtn.addEventListener('click', verifyShare);
            backBtn.addEventListener('click', goBack);
            shareDownloadMinimizeBtn.addEventListener('click', minimizeDownloadCenter);
            shareDownloadToggle.addEventListener('click', restoreDownloadCenter);
            downloadAllBtn.addEventListener('click', function () {
                if (!shareInfo || !shareInfo.isFolder) {
                    return;
                }
                startBatchShareDownload();
            });
            downloadBtn.addEventListener('click', function () {
                if (!shareInfo || shareInfo.isFolder) {
                    return;
                }
                startSingleShareDownload();
            });
            passwordInput.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    verifyShare();
                }
            });
        }

        function loadAccessInfo() {
            axios.get(apiPath('/api/share/access-info'), { params: { shareCode: shareCode } })
                .then(function (response) {
                    if (response.data.code !== 200) {
                        throw new Error(response.data.message || '加载分享失败');
                    }
                    shareInfo = response.data.data;
                    shareDisplayPath = shareInfo.displayPath || '';
                    downloadThresholdMB = Number(shareInfo.frontendDownloadThresholdMB || 100);
                    renderMeta();
                    if (shareInfo.hasPassword) {
                        verifyBlock.classList.remove('hidden');
                        hintEl.textContent = '该分享已设置提取码，验证后即可访问。';
                        if (passwordInput.value) {
                            verifyShare();
                        }
                    } else {
                        verifyShare();
                    }
                })
                .catch(function (error) {
                    renderError(extractMessage(error));
                });
        }

        function verifyShare() {
            clearError();
            var requestParams = { shareCode: shareCode };
            if (passwordInput.value) {
                requestParams.password = passwordInput.value;
            }

            axios.get(apiPath('/api/share/info'), { params: requestParams })
                .then(function (response) {
                    if (response.data.code !== 200) {
                        throw new Error(response.data.message || '验证失败');
                    }
                    shareInfo = response.data.data;
                    downloadThresholdMB = Number(shareInfo.frontendDownloadThresholdMB || downloadThresholdMB || 100);
                    renderMeta();
                    hintEl.textContent = shareInfo.isFolder
                        ? '验证通过，可以像网盘一样浏览内容。'
                        : '验证通过，可以直接下载文件。';
                    if (shareInfo.hasPassword) {
                        verifyBlock.classList.remove('hidden');
                    }
                    if (shareInfo.isFolder) {
                        singleActions.classList.add('hidden');
                        browserPanel.classList.remove('hidden');
                        historyStack = [];
                        loadItems('');
                    } else {
                        browserPanel.classList.add('hidden');
                        singleActions.classList.remove('hidden');
                    }
                })
                .catch(function (error) {
                    singleActions.classList.add('hidden');
                    browserPanel.classList.add('hidden');
                    verifyBlock.classList.remove('hidden');
                    renderError(extractMessage(error));
                });
        }

        function loadItems(path) {
            clearError();
            axios.get(apiPath('/api/share/items'), {
                params: {
                    shareCode: shareCode,
                    password: passwordInput.value,
                    path: path || ''
                }
            }).then(function (response) {
                if (response.data.code !== 200) {
                    throw new Error(response.data.message || '加载列表失败');
                }
                currentPath = path || '';
                renderItems(response.data.data || []);
            }).catch(function (error) {
                renderError(extractMessage(error));
            });
        }

        function renderMeta() {
            titleEl.textContent = shareInfo.fileName || '未命名分享';
            metaEl.textContent = (shareInfo.isFolder ? '目录 / 批量分享' : '单文件分享') +
                ' · 原始路径: ' + (shareDisplayPath || '/') +
                ' · 过期时间: ' + (shareInfo.expireTime || '未知');
            typeBadge.textContent = shareInfo.isFolder ? '浏览式分享' : '文件直链';
        }

        function renderItems(items) {
            itemListEl.innerHTML = '';
            countBadge.textContent = '共 ' + items.length + ' 项';
            emptyStateEl.classList.toggle('hidden', items.length > 0);
            crumbEl.textContent = currentPath
                ? ('原始路径: ' + (shareDisplayPath || '/') + ' · 当前位置: ' + currentPath)
                : ('原始路径: ' + (shareDisplayPath || '/'));
            backBtn.classList.toggle('hidden', historyStack.length === 0);

            items.forEach(function (item) {
                var row = document.createElement('div');
                row.className = 'item';

                var main = document.createElement('div');
                main.className = 'item-main';
                var name = document.createElement('div');
                name.className = 'item-name';
                name.textContent = item.fileName;
                var sub = document.createElement('div');
                sub.className = 'item-sub';
                sub.textContent = item.isFolder ? '目录' : formatSize(item.size || 0);
                main.appendChild(name);
                main.appendChild(sub);

                var kind = document.createElement('div');
                kind.className = 'item-kind';
                kind.textContent = item.isFolder ? '文件夹' : '文件';

                var actions = document.createElement('div');
                actions.className = 'item-actions';
                var primaryBtn = document.createElement('button');
                primaryBtn.textContent = item.isFolder ? '打开' : '下载';
                primaryBtn.addEventListener('click', function () {
                    if (item.isFolder) {
                        historyStack.push({ path: currentPath, label: currentPath ? readableName(currentPath) : '根目录' });
                        loadItems(item.objectName);
                    } else {
                        startSharedItemDownload(item);
                    }
                });
                actions.appendChild(primaryBtn);

                row.appendChild(main);
                row.appendChild(kind);
                row.appendChild(actions);
                itemListEl.appendChild(row);
            });
        }

        function goBack() {
            if (historyStack.length === 0) {
                return;
            }
            var previous = historyStack.pop();
            loadItems(previous.path);
        }

        function buildUrl(base, query) {
            var search = new URLSearchParams();
            Object.keys(query).forEach(function (key) {
                if (query[key]) {
                    search.set(key, query[key]);
                }
            });
            return base + '?' + search.toString();
        }

        function readableName(path) {
            var normalized = path.endsWith('/') ? path.slice(0, -1) : path;
            var index = normalized.lastIndexOf('/');
            return index >= 0 ? normalized.slice(index + 1) : normalized;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function renderError(message) {
            errorEl.textContent = message;
        }

        function clearError() {
            errorEl.textContent = '';
        }

        function extractMessage(error) {
            return error && error.response && error.response.data
                ? (error.response.data.message || '分享内容加载失败，请稍后重试')
                : (error && error.message ? error.message : '分享内容加载失败，请稍后重试');
        }

        function openDownloadCenter() {
            shareDownloadCenter.classList.remove('hidden');
            shareDownloadToggle.classList.add('hidden');
            downloadCenterMinimized = false;
        }

        function minimizeDownloadCenter() {
            shareDownloadCenter.classList.add('hidden');
            shareDownloadToggle.classList.remove('hidden');
            downloadCenterMinimized = true;
            renderDownloadTasks();
        }

        function restoreDownloadCenter() {
            openDownloadCenter();
            renderDownloadTasks();
        }

        function createDownloadTask(name, totalBytes) {
            return {
                id: 'share-download-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
                name: name,
                step: '准备中',
                status: 'running',
                progress: 0,
                downloadedBytes: 0,
                totalBytes: totalBytes || 0,
                error: '',
                type: 'single-file',
                controller: null,
                abortController: null,
                retryHandler: null
            };
        }

        function resolveArchiveTaskStep(task) {
            if (task && task.status === 'COMPLETED') {
                return downloadHelpers.BATCH_DOWNLOAD_STEPS ? downloadHelpers.BATCH_DOWNLOAD_STEPS[2] : '开始下载';
            }
            if (task && task.status === 'FAILED') {
                return '归档失败';
            }
            if (task && task.status === 'EXPIRED') {
                return '归档已过期';
            }
            if ((task && task.stage || '').toUpperCase() === 'QUEUED') {
                return '排队中';
            }
            return downloadHelpers.BATCH_DOWNLOAD_STEPS ? downloadHelpers.BATCH_DOWNLOAD_STEPS[1] : '等待归档完成';
        }

        function resolveArchiveTaskProgress(task) {
            if ((task && task.status || '').toUpperCase() === 'COMPLETED') {
                return 98;
            }
            var total = Number(task && task.fileCountTotal || 0);
            var processed = Number(task && task.fileCountProcessed || 0);
            if (total > 0) {
                return Math.max(5, Math.min(95, 5 + processed / total * 90));
            }
            return 10;
        }

        function createAbortablePollWait(abortController) {
            return function (delayMs) {
                return new Promise(function (resolve, reject) {
                    if (abortController.signal.aborted) {
                        reject(new Error('ARCHIVE_TASK_CANCELLED'));
                        return;
                    }
                    var timer = setTimeout(function () {
                        abortController.signal.removeEventListener('abort', onAbort);
                        resolve();
                    }, Math.max(0, Number(delayMs || 0)));
                    var onAbort = function () {
                        clearTimeout(timer);
                        reject(new Error('ARCHIVE_TASK_CANCELLED'));
                    };
                    abortController.signal.addEventListener('abort', onAbort, { once: true });
                });
            };
        }

        function addDownloadTask(task) {
            downloadTasks.unshift(task);
            openDownloadCenter();
            renderDownloadTasks();
            return task;
        }

        function updateDownloadTask(taskId, patch) {
            downloadTasks = downloadTasks.map(function (task) {
                return task.id === taskId ? Object.assign({}, task, patch) : task;
            });
            renderDownloadTasks();
        }

        function getDownloadTask(taskId) {
            return downloadTasks.find(function (task) {
                return task.id === taskId;
            }) || null;
        }

        function markCancelledDownloadTask(taskId) {
            updateDownloadTask(taskId, {
                status: 'cancelled',
                step: '已取消',
                error: ''
            });
        }

        function markPausedDownloadTask(taskId) {
            updateDownloadTask(taskId, {
                status: 'paused',
                step: '已暂停'
            });
        }

        function createTaskActionButton(symbol, title, onClick, danger) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'secondary task-action-btn' + (danger ? ' task-action-btn--danger' : '');
            button.title = title;
            button.textContent = symbol;
            button.addEventListener('click', onClick);
            return button;
        }

        function renderDownloadTasks() {
            shareDownloadTaskList.innerHTML = '';
            var running = downloadTasks.filter(function (task) { return task.status === 'running'; }).length;
            var failed = downloadTasks.filter(function (task) { return task.status === 'failed'; }).length;
            shareDownloadSummary.textContent = running > 0 ? ('进行中 ' + running + ' 个') : (failed > 0 ? ('失败 ' + failed + ' 个') : '暂无进行中的下载');
            shareDownloadToggle.textContent = '下载任务' + (running > 0 ? (' ' + running) : '') + (failed > 0 ? (' / 失败 ' + failed) : '');
            if (downloadTasks.length === 0) {
                var empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = '暂无下载任务';
                shareDownloadTaskList.appendChild(empty);
                return;
            }
            downloadTasks.forEach(function (task) {
                var row = document.createElement('div');
                row.className = 'item';
                var main = document.createElement('div');
                main.className = 'item-main';
                var name = document.createElement('div');
                name.className = 'item-name';
                name.textContent = task.name;
                var sub = document.createElement('div');
                sub.className = 'item-sub';
                sub.textContent = task.step + ' · ' + Math.round(task.progress || 0) + '%'
                    + (task.totalBytes ? (' · ' + formatSize(task.downloadedBytes || 0) + ' / ' + formatSize(task.totalBytes)) : '')
                    + (task.error ? (' · ' + task.error) : '');
                main.appendChild(name);
                main.appendChild(sub);
                var kind = document.createElement('div');
                kind.className = 'item-kind';
                kind.textContent = task.status === 'failed' ? '失败' : (task.status === 'completed' ? '完成' : (task.status === 'paused' ? '已暂停' : (task.status === 'cancelled' ? '已取消' : '下载中')));
                var actions = document.createElement('div');
                actions.className = 'item-actions';
                if (task.type === 'single-file' && task.status === 'running') {
                    actions.appendChild(createTaskActionButton('⏸', '暂停下载', function () {
                        pauseDownloadTask(task.id);
                    }, false));
                }
                if (task.type === 'single-file' && task.status === 'paused') {
                    actions.appendChild(createTaskActionButton('▶', '继续下载', function () {
                        resumeDownloadTask(task.id);
                    }, false));
                }
                if (task.status === 'running' || task.status === 'paused') {
                    actions.appendChild(createTaskActionButton('✕', '取消下载', function () {
                        cancelDownloadTask(task.id);
                    }, true));
                }
                if (task.status === 'completed' || task.status === 'failed' || task.status === 'cancelled') {
                    actions.appendChild(createTaskActionButton('↻', '重新下载', function () {
                        retryDownloadTask(task.id);
                    }, false));
                }
                row.appendChild(main);
                row.appendChild(kind);
                row.appendChild(actions);
                shareDownloadTaskList.appendChild(row);
            });
        }

        function authorizedHeaders() {
            var token = window.localStorage.getItem('token');
            return token ? { Authorization: 'Bearer ' + token } : {};
        }

        function startSingleShareDownload(existingTaskId) {
            axios.get(apiPath('/api/share/file'), {
                params: {
                    shareCode: shareCode,
                    password: passwordInput.value
                }
            }).then(function (response) {
                if (response.data.code !== 200) {
                    throw new Error(response.data.message || '读取分享文件信息失败');
                }
                var file = response.data.data || {};
                return axios.post(apiPath('/api/transfer/download/session'), {
                    scene: 'SHARE_FILE',
                    shareCode: shareCode,
                    password: passwordInput.value
                }).then(function (sessionResponse) {
                    return window.TransferUiHelpers.runSingleFileDownload(sessionResponse.data.data || sessionResponse.data, function (url) {
                        window.location.href = url;
                    });
                });
            }).catch(function (error) {
                renderError(extractMessage(error));
            });
        }

        function startSharedItemDownload(item, existingTaskId) {
            axios.post(apiPath('/api/transfer/download/session'), {
                scene: 'SHARE_ITEM',
                shareCode: shareCode,
                password: passwordInput.value,
                objectName: item.objectName
            }).then(function (sessionResponse) {
                return window.TransferUiHelpers.runSingleFileDownload(sessionResponse.data.data || sessionResponse.data, function (url) {
                    window.location.href = url;
                });
            }).catch(function (error) {
                renderError(extractMessage(error));
            });
        }

        function startBatchShareDownload(existingTaskId) {
            var taskId = existingTaskId || addDownloadTask(createDownloadTask((shareInfo.fileName || '分享内容') + '.zip', 0)).id;
            var abortController = new AbortController();
            updateDownloadTask(taskId, {
                type: 'batch-download',
                name: (shareInfo.fileName || '分享内容') + '.zip',
                step: downloadHelpers.BATCH_DOWNLOAD_STEPS ? downloadHelpers.BATCH_DOWNLOAD_STEPS[0] : '创建归档任务',
                status: 'running',
                progress: 0,
                downloadedBytes: 0,
                totalBytes: 0,
                error: '',
                controller: null,
                abortController: abortController,
                retryHandler: function () {
                    startBatchShareDownload(taskId);
                }
            });
            if (!downloadHelpers.runArchiveTaskDownload) {
                updateDownloadTask(taskId, { status: 'failed', error: '当前版本不支持归档任务下载' });
                return;
            }
            downloadHelpers.runArchiveTaskDownload({
                payload: {
                    scene: 'SHARE',
                    taskType: 'FOLDER',
                    shareCode: shareCode,
                    password: passwordInput.value
                },
                createTaskRequest: function (payload) {
                    return axios.post(apiPath('/api/transfer/archive-tasks'), payload);
                },
                getTaskRequest: function (taskId) {
                    return axios.get(apiPath('/api/transfer/archive-tasks/' + taskId), {
                        params: {
                            shareCode: shareCode,
                            password: passwordInput.value
                        }
                    });
                },
                onUpdate: function (task) {
                    updateDownloadTask(taskId, {
                        step: resolveArchiveTaskStep(task),
                        progress: resolveArchiveTaskProgress(task),
                        downloadedBytes: Number(task && task.bytesWritten || 0),
                        totalBytes: Number(task && task.bytesWritten || 0)
                    });
                },
                wait: createAbortablePollWait(abortController),
                openDownload: function (url) {
                    return window.TransferUiHelpers.runArchiveDownload(
                        url,
                        (shareInfo.fileName || '分享内容') + '.zip',
                        window.TransferUiHelpers.createNativeDownload
                    );
                }
            }).then(function (result) {
                updateDownloadTask(taskId, {
                    status: 'completed',
                    step: '保存完成',
                    progress: 100,
                    downloadedBytes: Number(result && result.task && result.task.bytesWritten || 0),
                    totalBytes: Number(result && result.task && result.task.bytesWritten || 0)
                });
            }).catch(function (error) {
                if (
                    abortController.signal.aborted
                    || error.code === 'ERR_CANCELED'
                    || error.name === 'CanceledError'
                    || error.message === 'ARCHIVE_TASK_CANCELLED'
                ) {
                    markCancelledDownloadTask(taskId);
                    return;
                }
                updateDownloadTask(taskId, { status: 'failed', error: extractMessage(error) });
            });
        }

        function pauseDownloadTask(taskId) {
            var task = getDownloadTask(taskId);
            if (!task || task.status !== 'running' || !task.controller || typeof task.controller.pause !== 'function') {
                return;
            }
            task.controller.pause();
            markPausedDownloadTask(taskId);
        }

        function resumeDownloadTask(taskId) {
            var task = getDownloadTask(taskId);
            if (!task || task.status !== 'paused' || !task.controller || typeof task.controller.resume !== 'function') {
                return;
            }
            updateDownloadTask(taskId, {
                status: 'running',
                step: '正在下载大文件',
                error: ''
            });
            task.controller.resume().then(function () {
                var state = task.controller.getState();
                if (state.status === 'paused') {
                    markPausedDownloadTask(taskId);
                    return;
                }
                if (state.status === 'cancelled') {
                    markCancelledDownloadTask(taskId);
                    return;
                }
                updateDownloadTask(taskId, {
                    status: 'completed',
                    step: '保存完成',
                    progress: 100,
                    downloadedBytes: task.totalBytes || state.totalBytes || 0
                });
            }).catch(function (error) {
                updateDownloadTask(taskId, { status: 'failed', error: extractMessage(error) });
            });
        }

        function cancelDownloadTask(taskId) {
            var task = getDownloadTask(taskId);
            if (!task || (task.status !== 'running' && task.status !== 'paused')) {
                return;
            }
            if (task.controller && typeof task.controller.cancel === 'function') {
                task.controller.cancel();
                markCancelledDownloadTask(taskId);
                return;
            }
            if (task.abortController) {
                task.abortController.abort();
                markCancelledDownloadTask(taskId);
            }
        }

        function retryDownloadTask(taskId) {
            var task = getDownloadTask(taskId);
            if (task && typeof task.retryHandler === 'function') {
                task.retryHandler();
            }
        }
    })();
</script>
