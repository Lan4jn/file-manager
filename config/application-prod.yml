# 生产环境配置
# 使用方式: ENV_FILE=prod java -jar file-manager-1.0.0.jar

server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:/opt/app/config/file-manager.db
  jpa:
    database-platform: com.github.gwenn.sqlitedialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: Poss#1144
  default-bucket: file-manager
  public-url: http://localhost:9000

jwt:
  secret: prod-jwt-secret-key-change-this
  expiration: 86400000

logging:
  level:
    com.poss.file: info
