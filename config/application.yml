# Default configuration (lowest priority)
# This file serves as base configuration

server:
  port: 9080
  forward-headers-strategy: framework
  # HTTPS 配置（已启用，使用自签名证书）
  ssl:
    enabled: true
    key-store: file:./config/ssl/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: file-manager

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10GB
      max-request-size: 10GB
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/file-manager.db
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  default-bucket: file-manager
  public-url: https://localhost:9000

jwt:
  secret: default-jwt-secret-key-must-be-at-least-32-characters-long
  expiration: 86400000

app:
  security:
    force-https: true

logging:
  level:
    com.poss.file: info
  config: ./config/log4j2.xml

# UI 配置
ui:
  # 界面模式: full=完整功能界面, lite=低GPU轻量界面
  mode: full
