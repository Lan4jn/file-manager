# 开发环境配置
# 使用方式: ENV_FILE=dev java -jar file-manager-1.0.0.jar

server:
  port: 9080

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/file-manager-dev.db
  jpa:
    database-platform: org.sqlite.hibernate.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

minio:
  endpoint: http://10.235.10.71:9000
  access-key: minioadmin
  secret-key: Poss#1144
  default-bucket: file-manager
  public-url: http://10.235.10.71:9000

jwt:
  secret: dev-jwt-secret-key-must-be-at-least-32-characters-long
  expiration: 86400000

logging:
  level:
    com.poss.file: debug
